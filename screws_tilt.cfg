# =============================================================================
#  screws_tilt.cfg - SCREWS_TILT for the Creality K2 series, as plain macros
#  Version 1.0.0 - https://github.com/piplarsson/k2-screws-tilt-macros
#
#  Probes the bed above each leveling screw with the nozzle's own strain-gauge
#  probe (the same PROBE the printer uses for its bed mesh) and tells you how
#  far to turn each screw. Works like Klipper's SCREWS_TILT_CALCULATE, but
#  needs no extra Klipper module, so nothing outside the config folder is
#  changed. Works on its own and next to bl_macros.cfg (no shared names).
#
#  Install: upload this file next to printer.cfg and add to printer.cfg:
#      [include screws_tilt.cfg]
#
#  Usage:
#    1. SCREWS_TILT_MEASURE  The first run heats the bed, wipes the nozzle and
#                            lets the bed settle (a few minutes). Then it
#                            probes the screws and the bed center and prints
#                            a report, for example:
#                              Rear left: +0.418 mm -> LOWER 0.60 turn (36 min)
#                            One screw is the reference for that round and is
#                            not turned.
#    2. Turn the screws as the report says.
#    3. Run SCREWS_TILT_MEASURE again (now it only probes, about a minute).
#       Repeat until it says all screws are within tolerance, usually 2-3
#       rounds.
#    4. SCREWS_TILT_FINISH   Lifts the nozzle and runs G29 (auto-leveling),
#                            which re-measures Z-tilt, Z max and the bed mesh.
#
#  Which way raises a corner? Turn one knob a quarter turn and measure again:
#  the report shows whether that corner went up or down. Then set
#  raise_direction below and the report also says CW or CCW.
#
#  Note: firmware updates can delete this file but leave the include line,
#  which stops Klipper from starting (XS3002). Upload the file again or
#  remove the include line if that happens.
#
#  Copyright (C) 2026 piplarsson
#  This file may be distributed under the terms of the GNU GPLv3 license.
# =============================================================================


[gcode_macro _ST_SETTINGS]
description: Settings for the screws tilt macros (edit the values below)
# ---- Screw positions --------------------------------------------------------
# Nozzle X/Y straight above each leveling screw, as [X, Y, "Name"]. Find them
# by jogging the nozzle over each screw in Fluidd and reading the position
# (or run GET_POSITION). Names: letters, digits and spaces only.
# Empty list [] = the built-in positions below if this bed has them,
# otherwise four points "margin" mm in from the bed corners, in this order:
# 1 front left, 2 rear left, 3 rear right, 4 front right.
variable_screws: []
variable_margin: 30
# Built-in screw positions for the K2 series, chosen by the bed size that
# Creality's product_param reports (X x Y in mm). Used only on K2 printers
# and only when screws is empty.
#   350x350 = K2 Plus with the stock bed, measured on a K2 Plus by lowering
#             the nozzle over each screw head.
# A replacement bed can have its screws elsewhere: check, then set screws.
variable_presets: {"350x350": [[44, 30, "Front left"], [44, 316, "Rear left"],
                               [306, 316, "Rear right"], [306, 30, "Front right"]]}
# Bed size in mm. 0 = read it from the firmware (product_param on the K2
# series, otherwise from the [bed_mesh] area).
variable_bed_size_x: 0
variable_bed_size_y: 0
# ---- Screws -----------------------------------------------------------------
# Height change per full turn of a screw, in mm: 0.7 = M4 (most likely on
# the K2 series), 0.5 = M3, 0.8 = M5.
variable_thread_pitch: 0.7
# Knob direction that RAISES a corner (moves it up toward the nozzle), as
# you see the knob while you turn it: "CW" or "CCW". Leave "" until you have
# checked it once: the report then only says RAISE or LOWER.
variable_raise_direction: ""
# Reference screw. 0 = automatic: the screw that needs the least turning in
# total. 1, 2, ... = always that screw, counted in list order (the built-in
# and the automatic lists run front left, rear left, rear right, front right).
variable_reference: 0
# Screws closer than this to the reference (mm) count as done.
variable_tolerance: 0.03
# Probe samples per point. The median is used.
variable_samples: 3
# Also probe the bed center. Information only: shows whether the plate
# itself is bowed, which the screws cannot fix but the bed mesh can.
variable_probe_center: True
# ---- Heating ----------------------------------------------------------------
# Bed temperature. 0 = the firmware's leveling temperature (50 C on the
# K2 Plus, the same temperature G29 uses).
variable_bed_temp: 0
# Nozzle temperature. 0 = the firmware's homing temperature (140 C on the
# K2 Plus): warm enough to soften residue, too cold to ooze.
variable_nozzle_temp: 0
# Minutes to let the bed and frame settle after the bed reaches temperature.
variable_soak_minutes: 3
# Wipe the nozzle (NOZZLE_CLEAR) before probing.
variable_nozzle_clean: True
# Run G29 (auto-leveling) in SCREWS_TILT_FINISH. False = heaters off only.
variable_auto_level_at_end: True
# Speeds in mm/s.
variable_travel_speed: 100
variable_z_speed: 10
gcode:


[gcode_macro _ST_STATE]
description: Internal state of the screws tilt macros (do not edit)
variable_ready: False
variable_bed_target: 0.0
variable_points: []
variable_center: []
variable_zs: []
gcode:


[gcode_macro _ST_SAY]
description: Print a console message when this line is reached
gcode:
    {action_respond_info(params.MSG|default("")|string)}


[gcode_macro _ST_PREPARE]
description: Heat, wipe the nozzle and let the bed settle before probing
gcode:
    {% set s = printer["gcode_macro _ST_SETTINGS"] %}
    {% set cm = printer.custom_macro if "custom_macro" in printer else {} %}
    {% set bed = s.bed_temp|float %}
    {% if bed <= 0 %}
      {% set bed = cm.default_bed_temp|default(60)|float %}
    {% endif %}
    {% set noz = s.nozzle_temp|float %}
    {% if noz <= 0 %}
      {% set noz = cm.g28_ext_temp|default(140)|float %}
    {% endif %}
    {% set k2 = "prtouch_v3" in printer.configfile.config %}
    _ST_SAY MSG="Screws tilt: heating the bed to {bed|int} C and the nozzle to {noz|int} C"
    M106 S0
    M140 S{bed}
    M104 S{noz}
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    {% if k2 and s.nozzle_clean %}
      NOZZLE_CLEAR
      M104 S{noz}
    {% endif %}
    _ST_SAY MSG="Waiting for the bed ({bed|int} C) and the nozzle ({noz|int} C)"
    M190 S{bed}
    M109 S{noz}
    {% for left in range(s.soak_minutes|int, 0, -1) %}
      _ST_SAY MSG="Letting the bed settle: {left} min left"
      G4 P60000
    {% endfor %}
    BED_MESH_CLEAR
    SET_GCODE_VARIABLE MACRO=_ST_STATE VARIABLE=bed_target VALUE={bed}
    SET_GCODE_VARIABLE MACRO=_ST_STATE VARIABLE=ready VALUE=True


[gcode_macro _ST_PROBE_AT]
description: Probe the bed at X/Y and store the result
gcode:
    {% set s = printer["gcode_macro _ST_SETTINGS"] %}
    {% set zf = s.z_speed|float * 60 %}
    {% set tf = s.travel_speed|float * 60 %}
    G90
    G1 Z5 F{zf}
    G1 X{params.X} Y{params.Y} F{tf}
    PROBE SAMPLES={s.samples|int} SAMPLES_RESULT=median
    _ST_STORE
    G1 Z5 F{zf}


[gcode_macro _ST_STORE]
description: Store the last probe result
gcode:
    {% set zs = printer["gcode_macro _ST_STATE"].zs + [printer.probe.last_z_result|float] %}
    SET_GCODE_VARIABLE MACRO=_ST_STATE VARIABLE=zs VALUE="{zs}"


[gcode_macro _ST_REPORT]
description: Print how far to turn each screw, from the last measurement
gcode:
    {% set s = printer["gcode_macro _ST_SETTINGS"] %}
    {% set st = printer["gcode_macro _ST_STATE"] %}
    {% set pts = st.points %}
    {% set n = pts|length %}
    {% set zs = st.zs %}
    {% if n < 3 or zs|length < n %}
      {action_raise_error("screws_tilt: only %d of %d points were probed." % (zs|length, n))}
    {% endif %}
    {% set pitch = s.thread_pitch|float %}
    {% set tol = s.tolerance|float %}
    {% set up = s.raise_direction|string|upper %}
    {% set down = "CCW" if up == "CW" else ("CW" if up == "CCW" else "") %}
    # Reference: one of the middle screws, which keeps the total turning lowest
    {% set pairs = [] %}
    {% for i in range(n) %}
      {% set _ = pairs.append([zs[i], i]) %}
    {% endfor %}
    {% set sp = pairs|sort %}
    {% set mean = (zs[:n]|sum) / n %}
    {% set a = sp[(n - 1) // 2] %}
    {% set b = sp[n // 2] %}
    {% set ref = a[1] if (a[0] - mean)|abs <= (b[0] - mean)|abs else b[1] %}
    {% if s.reference|int >= 1 and s.reference|int <= n %}
      {% set ref = s.reference|int - 1 %}
    {% endif %}
    {% set zref = zs[ref] %}
    {% set out = ["Screws tilt: corners differ by %.3f mm (1 turn = %.2f mm, 15 min = 1/4 turn)" % (sp[-1][0] - sp[0][0], pitch)] %}
    {% set ns = namespace(worst=0.0) %}
    {% for i in range(n) %}
      {% set d = zs[i] - zref %}
      {% set name = pts[i][2] %}
      {% if i == ref %}
        {% set _ = out.append("%s: reference, do not turn" % name) %}
      {% elif d|abs <= tol %}
        {% set _ = out.append("%s: %+.3f mm, OK" % (name, d)) %}
      {% else %}
        {% set turns = d|abs / pitch %}
        {% set full = turns|int %}
        {% set mins = ((turns - full) * 60)|round|int %}
        {% if mins >= 60 %}
          {% set full = full + 1 %}
          {% set mins = 0 %}
        {% endif %}
        {% set amount = ("%d min" % mins) if full == 0 else ("%d turn + %d min" % (full, mins)) %}
        {% set word = "LOWER" if d > 0 else "RAISE" %}
        {% set way = down if d > 0 else up %}
        {% set _ = out.append("%s: %+.3f mm -> %s %.2f turn%s (%s)" % (name, d, word, turns, (" " ~ way) if way else "", amount)) %}
      {% endif %}
      {% if d|abs > ns.worst %}
        {% set ns.worst = d|abs %}
      {% endif %}
    {% endfor %}
    {% if st.center|length == 2 and zs|length > n %}
      {% set _ = out.append("Center: %+.3f mm vs. the corner average (plate bow, the mesh handles that, not the screws)" % (zs[n] - mean)) %}
    {% endif %}
    {% if ns.worst <= tol %}
      {% set _ = out.append("All screws within %.2f mm. Done: run SCREWS_TILT_FINISH." % tol) %}
    {% else %}
      {% set _ = out.append("Turn the screws as above, then run SCREWS_TILT_MEASURE again.") %}
    {% endif %}
    {% if not up %}
      {% set _ = out.append("Tip: set raise_direction in _ST_SETTINGS once you know which way raises a corner.") %}
    {% endif %}
    {action_respond_info(out|join("\n"))}


[gcode_macro SCREWS_TILT_MEASURE]
description: Probe the bed screws and show how far to turn each one
gcode:
    {% set s = printer["gcode_macro _ST_SETTINGS"] %}
    {% set st = printer["gcode_macro _ST_STATE"] %}
    {% set zf = s.z_speed|float * 60 %}
    # Bed size: setting, else Creality's product_param, else the [bed_mesh] area
    {% set bx = s.bed_size_x|float %}
    {% set by = s.bed_size_y|float %}
    {% if bx <= 0 or by <= 0 %}
      {% if "gcode_macro product_param" in printer %}
        {% set bx = printer["gcode_macro product_param"].bed_size_x|default(0)|float %}
        {% set by = printer["gcode_macro product_param"].bed_size_y|default(0)|float %}
      {% elif "bed_mesh" in printer.configfile.config %}
        {% set mn = printer.configfile.config.bed_mesh.mesh_min.split(",") %}
        {% set mx = printer.configfile.config.bed_mesh.mesh_max.split(",") %}
        {% set bx = mn[0]|float + mx[0]|float %}
        {% set by = mn[1]|float + mx[1]|float %}
      {% endif %}
    {% endif %}
    {% if bx <= 0 or by <= 0 %}
      {action_raise_error("screws_tilt: bed size unknown. Set bed_size_x and bed_size_y in _ST_SETTINGS.")}
    {% endif %}
    # Screw points: your list, else the built-in positions for this bed (K2
    # series only), else four points margin mm in from the corners
    {% set key = "%dx%d" % (bx|round|int, by|round|int) %}
    {% set presets = s.presets if s.presets is mapping else {} %}
    {% if s.screws|length > 0 %}
      {% set src = s.screws %}
      {% set what = "your list in _ST_SETTINGS" %}
    {% elif "gcode_macro product_param" in printer and key in presets %}
      {% set src = presets[key] %}
      {% set what = "built in for a %s bed" % key %}
    {% else %}
      {% set src = [] %}
      {% set what = "%.0f mm in from the corners, set screws in _ST_SETTINGS if yours are elsewhere" % (s.margin|float) %}
    {% endif %}
    {% set pts = [] %}
    {% for p in src %}
      {% set _ = pts.append([p[0]|float, p[1]|float, (p[2] if p|length > 2 else "Screw %d" % loop.index)|string]) %}
    {% endfor %}
    {% if src|length == 0 %}
      {% set m = s.margin|float %}
      {% if m < 0 or 2 * m >= bx or 2 * m >= by %}
        {action_raise_error("screws_tilt: margin %.1f does not fit a %.0f x %.0f bed." % (m, bx, by))}
      {% endif %}
      {% set pts = [[m, m, "Front left"], [m, by - m, "Rear left"],
                    [bx - m, by - m, "Rear right"], [bx - m, m, "Front right"]] %}
    {% endif %}
    {% if pts|length < 3 %}
      {action_raise_error("screws_tilt: at least 3 screws are needed.")}
    {% endif %}
    {% set center = [bx / 2, by / 2] if s.probe_center else [] %}
    {% set need_prep = (not st.ready)
         or ("xyz" not in printer.toolhead.homed_axes)
         or (printer.heater_bed.target|float != st.bed_target|float) %}
    {% if need_prep %}
      _ST_PREPARE
    {% endif %}
    BED_MESH_CLEAR
    SET_GCODE_VARIABLE MACRO=_ST_STATE VARIABLE=points VALUE="{pts}"
    SET_GCODE_VARIABLE MACRO=_ST_STATE VARIABLE=center VALUE="{center}"
    SET_GCODE_VARIABLE MACRO=_ST_STATE VARIABLE=zs VALUE="[]"
    _ST_SAY MSG="Screw positions: {what}"
    {% for p in pts %}
      _ST_SAY MSG="Probing {p[2]} (X{"%.1f" % p[0]} Y{"%.1f" % p[1]})"
      _ST_PROBE_AT X={"%.2f" % p[0]} Y={"%.2f" % p[1]}
    {% endfor %}
    {% if center %}
      _ST_SAY MSG="Probing the center"
      _ST_PROBE_AT X={"%.2f" % center[0]} Y={"%.2f" % center[1]}
    {% endif %}
    G90
    G1 Z10 F{zf}
    _ST_REPORT


[gcode_macro SCREWS_TILT_FINISH]
description: Finish screws tilt - lift, then auto-leveling (G29) or heaters off
gcode:
    {% set s = printer["gcode_macro _ST_SETTINGS"] %}
    SET_GCODE_VARIABLE MACRO=_ST_STATE VARIABLE=ready VALUE=False
    {% if "z" in printer.toolhead.homed_axes %}
      G90
      G1 Z15 F{s.z_speed|float * 60}
    {% endif %}
    {% if s.auto_level_at_end and "gcode_macro G29" in printer %}
      _ST_SAY MSG="Screws tilt done. Running G29: new Z-tilt, Z max and bed mesh"
      G29
    {% else %}
      TURN_OFF_HEATERS
      _ST_SAY MSG="Screws tilt done. Run auto-leveling (G29) before the next print"
    {% endif %}
